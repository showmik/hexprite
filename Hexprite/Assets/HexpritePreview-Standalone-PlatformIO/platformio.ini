; ═══════════════════════════════════════════════════════════════════════════════
;  HexpritePreview-Standalone-PlatformIO — PlatformIO Configuration
; ═══════════════════════════════════════════════════════════════════════════════
;
;  QUICK START:
;  1. Uncomment the [env:...] block that matches your board
;  2. Edit src/config.h for your display type and pin wiring
;  3. Build & Upload: pio run -t upload
;
;  If your board isn't listed, copy any env block and change the
;  board = ... line.  See https://registry.platformio.org/search?t=board
; ═══════════════════════════════════════════════════════════════════════════════

[platformio]
; Set the default environment here, or use `pio run -e <name>`
default_envs = uno

; ── Shared settings ──────────────────────────────────────────────────────────
[common]
lib_deps =
    olikraus/U8g2@^2.35.30
monitor_speed = 115200
framework = arduino

; ─────────────────────────────────────────────────────────────────────────────
;  BOARDS — uncomment the one you're using
; ─────────────────────────────────────────────────────────────────────────────

; ── Arduino Uno / Nano (ATmega328P) ──────────────────────────────────────────
[env:uno]
platform = atmelavr
board = uno
framework = ${common.framework}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}

; ── Arduino Nano (new bootloader) ────────────────────────────────────────────
; [env:nanoatmega328new]
; platform = atmelavr
; board = nanoatmega328new
; framework = ${common.framework}
; lib_deps = ${common.lib_deps}
; monitor_speed = ${common.monitor_speed}

; ── Arduino Mega 2560 ────────────────────────────────────────────────────────
; [env:mega]
; platform = atmelavr
; board = megaatmega2560
; framework = ${common.framework}
; lib_deps = ${common.lib_deps}
; monitor_speed = ${common.monitor_speed}

; ── ESP32 DevKit ─────────────────────────────────────────────────────────────
; [env:esp32]
; platform = espressif32
; board = esp32dev
; framework = ${common.framework}
; lib_deps = ${common.lib_deps}
; monitor_speed = ${common.monitor_speed}

; ── ESP8266 (NodeMCU, Wemos D1 Mini) ────────────────────────────────────────
; [env:esp8266]
; platform = espressif8266
; board = nodemcuv2
; framework = ${common.framework}
; lib_deps = ${common.lib_deps}
; monitor_speed = ${common.monitor_speed}

; ── STM32 Blue Pill (STM32F103C8) ────────────────────────────────────────────
; [env:bluepill]
; platform = ststm32
; board = bluepill_f103c8
; framework = ${common.framework}
; lib_deps = ${common.lib_deps}
; monitor_speed = ${common.monitor_speed}
; upload_protocol = stlink

; ── Raspberry Pi Pico (RP2040) ───────────────────────────────────────────────
; [env:pico]
; platform = raspberrypi
; board = pico
; framework = ${common.framework}
; lib_deps = ${common.lib_deps}
; monitor_speed = ${common.monitor_speed}
